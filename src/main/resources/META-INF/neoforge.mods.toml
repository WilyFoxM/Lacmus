modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/WilyFoxM/Lacmus/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "WilyFox"
description = "A small network graph HUD."
logoFile = "assets/lacmus/icon.png"
displayURL = "https://github.com/WilyFoxM/Lacmus"
# Client-side only: a server does not need it, and its version does not matter.
displayTest = "IGNORE_ALL_VERSION"

[[mixins]]
config = "lacmus.mixins.json"

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "CLIENT"
