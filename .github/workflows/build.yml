name: Build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Check formatting
        run: ./gradlew formatCheck
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Run unit tests
        run: |
          ./gradlew :core:test
          # Once test sources exist, the run must produce results.
          if [ -d core/src/test/java ]; then compgen -G 'core/build/test-results/test/TEST-*.xml' > /dev/null; fi
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unit-test-results
          path: |
            core/build/test-results/test/*.xml
            core/build/reports/tests/test/
          if-no-files-found: ignore
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      # Builds every Stonecutter node (Minecraft version x loader).
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: Lacmus
          path: versions/*/build/libs/*.jar
